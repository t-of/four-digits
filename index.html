<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d1017">
  <meta name="description" content="4つの数字を順番どおりに使い、目標の数を作る数字パズル。">
  <title>OCCAM — テンパズル：4つの数字で1〜100を最短の式で</title>

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="OCCAM">
  <meta property="og:title" content="OCCAM — テンパズル：4つの数字で1〜100を最短の式で">
  <meta property="og:description" content="4つの数字を順番どおりに使い、目標の数を作る数字パズル。">
  <meta property="og:url" content="https://t-of.github.io/four-digits/">
  <meta property="og:image" content="https://t-of.github.io/four-digits/icons/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="ja_JP">
  <meta name="twitter:card" content="summary_large_image">

  <!-- apple-mobile-web-app-status-bar-style は付けない（black-translucent だと iOS 26 で上部が隠れる） -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="OCCAM">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">

  <link rel="stylesheet" href="./webapp-kit/webapp-kit.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="app">
    <header class="bar">
      <h1 class="bar__title">OCCAM</h1>
      <div class="bar__actions">
        <button class="pill" data-wak="install" hidden>アプリにする</button>
        <button class="pill" data-wak="share">共有</button>
      </div>
    </header>

    <section class="stage" id="stage">
      <!-- ホーム -->
      <div class="screen" id="s-home">
        <button class="card-auto" id="auto-btn">
          <small>おまかせ</small>
          <span class="lv" id="auto-lv"></span>
          <span class="card-auto__go">次の 1 問 ›</span>
        </button>
        <button class="card-daily" id="daily-btn">
          <small>今日の 1 問</small>
          <b id="daily-date"></b>
          <span class="card-daily__st" id="daily-st"></span>
          <span class="card-daily__streak" id="daily-streak"></span>
        </button>
        <div class="home-sub">
          <button class="back" id="free-btn">フリー</button>
          <button class="back" id="zukan-btn">図鑑</button>
        </div>
      </div>

      <!-- 1. 4 桁の一覧（フリー） -->
      <div class="screen" id="s-list" hidden>
        <div class="jump">
          <button class="back" id="list-back">‹ ホーム</button>
          <input id="jump" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="4桁を打って飛ぶ" autocomplete="off" aria-label="4桁を打って飛ぶ">
          <span class="jump__sum" id="list-sum"></span>
        </div>
        <div class="list" id="list-scroll">
          <div class="list__spacer" id="list-spacer"><div class="list__rows" id="list-rows"></div></div>
        </div>
      </div>

      <!-- 図鑑 -->
      <div class="screen" id="s-zukan" hidden>
        <div class="head">
          <button class="back" id="zukan-back">‹ ホーム</button>
          <div class="tabs" id="tabs">
            <button class="tab on" data-tab="digits">4桁</button>
            <button class="tab" data-tab="numbers">数</button>
          </div>
        </div>
        <div class="zbody" id="z-body"></div>
      </div>

      <!-- 2. 目標の一覧 -->
      <div class="screen" id="s-targets" hidden>
        <div class="head">
          <button class="back" id="targets-back">‹ 一覧</button>
          <div class="head__digits" id="targets-digits"></div>
          <div class="head__sum" id="targets-sum"></div>
        </div>
        <div class="targets" id="targets"></div>
      </div>

      <!-- 3. パズル -->
      <div class="screen" id="s-puzzle" hidden>
        <div class="head">
          <button class="back" id="puzzle-back">‹ 目標</button>
          <div class="head__target"><small id="puzzle-tag"></small><b id="puzzle-target"></b> を作る</div>
        </div>
        <!-- 表示部分（数字・式・値）はキーの上の空きいっぱいに広げ、中身は上下の真ん中に -->
        <div class="display">
        <div class="board__digits" id="puzzle-digits"></div>
        <div class="expr" id="expr" aria-live="polite"></div>
        <div class="info">
          <div class="info__value" id="value"></div>
          <div class="info__count" id="count"></div>
          <div class="info__mine" id="mine"></div>
          <button class="pill giveup" id="giveup" hidden>あきらめる</button>
        </div>
        </div>
        <!-- 入力は画面の下に寄せる（親指が届く位置） -->
        <div class="pad">
        <div class="keys" id="keys">
          <button class="key key--mv" data-key="left" id="key-left" aria-label="カーソルを左へ">◀</button>
          <button class="key key--mv" data-key="right" id="key-right" aria-label="カーソルを右へ">▶</button>
          <button class="key" data-ch="√">√</button>
          <button class="key" data-ch="^">^</button>
          <button class="key" data-ch="(">(</button>
          <button class="key" data-ch=")">)</button>
          <button class="key" data-ch=".">.</button>
          <button class="key key--fn" data-key="back" id="key-back" aria-label="カーソルの前の記号を1つ消す">⌫</button>
          <button class="key" data-ch="+">+</button>
          <button class="key" data-ch="−">−</button>
          <button class="key" data-ch="×">×</button>
          <button class="key" data-ch="÷">÷</button>
          <button class="key" data-ch="!">!</button>
          <button class="key" data-key="factn">!⁽ᴺ⁾</button>
          <button class="key key--fn key--wide" data-key="clear">全部消す</button>
        </div>
        <div class="nsel" id="nsel" hidden>
          <span>N 重階乗の N</span>
          <button class="key" id="n-minus" aria-label="N を減らす">−</button>
          <input id="n-input" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="3" value="2" aria-label="N">
          <button class="key" id="n-plus" aria-label="N を増やす">+</button>
          <button class="key key--ok" id="n-ok">入れる</button>
          <button class="key" id="n-cancel">やめる</button>
        </div>
        <div class="result" id="result" hidden>
          <div class="result__stars" id="r-stars"></div>
          <div class="result__text" id="r-text"></div>
          <div class="result__sub" id="r-sub"></div>
          <button class="key key--ok result__next" id="r-next">次へ</button>
          <button class="key result__retry" id="r-retry">もっと短く</button>
        </div>
        </div>
      </div>
    </section>

    <footer class="credit">
      <a href="/">T.OF...</a> ・ <a href="https://t-of.github.io/contact/">問い合わせ</a> ・ <span class="ver">v12</span>
    </footer>
  </main>

  <script src="./webapp-kit/webapp-kit.js"></script>
  <script type="module" src="./main.js"></script>
</body>
</html>
